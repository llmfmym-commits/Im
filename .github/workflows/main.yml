name: Build ImageAI APK

on:
workflow_dispatch:
push:
paths:
- "ImageAI_Android_Java.zip"
- ".github/workflows/build-imageai.yml"

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: "17"

  - name: Configure Android SDK
    shell: bash
    run: |
      echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)
      if [ -z "$SDKMANAGER" ]; then
        echo "ERROR: sdkmanager not found"
        exit 1
      fi

      yes | "$SDKMANAGER" --licenses || true
      "$SDKMANAGER" --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Verify ZIP exists
    shell: bash
    run: |
      if [ ! -f "ImageAI_Android_Java.zip" ]; then
        echo "ERROR: ImageAI_Android_Java.zip not found in repository root."
        echo "Upload the ZIP to the main repository page, then commit it."
        exit 1
      fi

  - name: Extract ZIP
    shell: bash
    run: |
      mkdir -p extracted
      unzip -o "ImageAI_Android_Java.zip" -d extracted
      echo "Extracted files:"
      find extracted -maxdepth 5 -type f | head -100

  - name: Find Gradle project
    shell: bash
    run: |
      SETTINGS=$(find extracted -type f \
        \( -name settings.gradle -o -name settings.gradle.kts \) \
        -print -quit)

      if [ -z "$SETTINGS" ]; then
        echo "ERROR: No settings.gradle or settings.gradle.kts found inside ZIP."
        exit 1
      fi

      PROJECT_DIR=$(dirname "$SETTINGS")
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Gradle project found at: $PROJECT_DIR"

  - name: Build debug APK
    shell: bash
    run: |
      cd "$PROJECT_DIR"

      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew --no-daemon assembleDebug
      else
        gradle --no-daemon assembleDebug
      fi

  - name: Collect APK
    shell: bash
    run: |
      APK=$(find "$PROJECT_DIR" -type f \
        -path "*/build/outputs/apk/*/*.apk" \
        -print -quit)

      if [ -z "$APK" ]; then
        echo "ERROR: Build finished but no APK was found."
        exit 1
      fi

      mkdir -p output
      cp "$APK" output/ImageAI-debug.apk
      echo "APK ready: output/ImageAI-debug.apk"

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: ImageAI-debug-APK
      path: output/ImageAI-debug.apk
      if-no-files-found: error
      retention-days: 7
