name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: |
          ZIP=$(ls *.zip | head -n1)
          echo "Using: $ZIP"
          mkdir -p work
          unzip -q "$ZIP" -d work
          PROJ=$(dirname "$(find work -name settings.gradle | head -n1)")
          echo "PROJ=$PWD/$PROJ" >> $GITHUB_ENV

      - name: Build release APK
        run: |
          cd "$PROJ"
          gradle assembleRelease -x lintVitalRelease --no-daemon

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p out out-key
          OK=0
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | tr -d ' \n\r\t' | base64 -d > my.keystore 2>/dev/null || true
            if keytool -list -keystore my.keystore -storepass "$KS_PASS" >/dev/null 2>&1; then
              OK=1
            fi
          fi
          if [ "$OK" = "0" ]; then
            echo "Secret keystore missing or invalid -> generating a new one"
            rm -f my.keystore
            KS_PASS=$(openssl rand -hex 12)
            KEY_PASS="$KS_PASS"
            KEY_ALIAS=imageai
            keytool -genkeypair -keystore my.keystore \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ImageAI, O=Dev, C=IR"
            base64 -w0 my.keystore > out-key/KEYSTORE_BASE64.txt
            printf "KEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n" \
              "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > out-key/INFO.txt
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          UNSIGNED=$(find "$PROJ" -name '*release-unsigned.apk' | head -n1)
          $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks my.keystore \
            --ks-pass pass:"$KS_PASS" --key-pass pass:"$KEY_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --out out/ImageAI-signed.apk aligned.apk
          $BT/apksigner verify out/ImageAI-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageAI-APK
          path: out/ImageAI-signed.apk

      - name: Upload new keystore (only if generated)
        if: hashFiles('out-key/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-BACKUP
          path: out-key/
