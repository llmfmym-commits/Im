
name: Build ImageAI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ImageAI_Android_Java.zip"
      - ".github/workflows/build-imageai.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Verify ZIP
        run: |
          test -f ImageAI_Android_Java.zip || {
            echo "ERROR: ZIP file not found in repository root"
            exit 1
          }

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o ImageAI_Android_Java.zip -d extracted
          find extracted -maxdepth 5 -type f | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/ImageAI-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageAI-debug-APK
          path: output/ImageAI-debug.apk
          if-no-files-found: error
          retention-days: 7
