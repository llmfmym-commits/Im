name: Build ImageAI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ImageAI_Android_Java.zip"
      - ".github/workflows/build-imageai.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          unzip -o ImageAI_Android_Java.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        run: |
          SETTINGS=$(find extracted -name settings.gradle -type f | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: extracted
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageAI-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
