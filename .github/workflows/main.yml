name: Build ImageAI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ImageAI_Android_Java.zip"
      - ".github/workflows/build-imageai.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check ZIP file
        run: |
          if [ ! -f "ImageAI_Android_Java.zip" ]; then
            echo "ERROR: ImageAI_Android_Java.zip not found in repository root"
            exit 1
          fi

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o ImageAI_Android_Java.zip -d extracted
          echo "Extracted project files:"
          find extracted -maxdepth 5 -type f | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Find generated APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/ImageAI-debug.apk"
          echo "APK copied successfully"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageAI-debug-APK
          path: output/ImageAI-debug.apk
          if-no-files-found: error
          retention-days: 7
